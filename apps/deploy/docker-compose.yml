# Stack de despliegue para la VM: consume las imagenes publicadas por GitHub
# Actions en GHCR. No construye nada; solo descarga y ejecuta.
name: sleep-edfx

services:
  api:
    image: ${API_IMAGE:?falta API_IMAGE en apps/deploy/.env}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # El artefacto del modelo vive fuera de la imagen (data/ esta en .dockerignore).
      - ${HOST_MODEL_DIR:?falta HOST_MODEL_DIR en apps/deploy/.env}:/artifacts/model:ro
      - sleep-uploads:/app/storage/uploads
    expose:
      - "8080"

  web:
    image: ${WEB_IMAGE:?falta WEB_IMAGE en apps/deploy/.env}
    pull_policy: always
    restart: unless-stopped
    ports:
      # nginx sirve el bundle estatico y hace proxy de /api/ hacia el servicio api.
      - "${WEB_HOST_PORT:-80}:4200"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sleep-uploads:
