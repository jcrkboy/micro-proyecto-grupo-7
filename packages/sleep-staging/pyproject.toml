[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-staging"
version = "0.1.0"
description = "Preprocesamiento reutilizable de EEG para Sleep-EDFx"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.12,<2",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
training = [
    "lightgbm==4.7.0",
    "matplotlib>=3.10,<4",
    "mlflow==3.15.2",
    "scikit-learn==1.7.2",
    "seaborn>=0.13,<1",
]
test = [
    "pytest>=8,<10",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
